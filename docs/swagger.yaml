basePath: /api/v1
definitions:
  main.Box:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  main.BoxItem:
    properties:
      id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      updatedAt:
        type: string
    type: object
  main.User:
    properties:
      boxes:
        items:
          $ref: '#/definitions/main.Box'
        type: array
    type: object
host: localhost:1323
info:
  contact: {}
  description: |-
    API for a web app that allows people to manage and easily find/search
    contents for their boxes without having to manually open boxes.
  title: Boom Box API
  version: "1.0"
paths:
  /{user_id}/add-box:
    post:
      parameters:
      - description: Unique user id
        in: path
        name: user_id
        required: true
        type: integer
      responses:
        "201":
          description: Created
        "400":
          description: 'Bad Request: (error description)'
          schema:
            type: string
        "404":
          description: User Not Found
          schema:
            type: string
      summary: Add a box to a user's collection
      tags:
      - Boxes
  /{user_id}/boxes:
    get:
      consumes:
      - application/json
      parameters:
      - description: Unique user id
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.User'
        "400":
          description: 'Bad Request: (error description)'
          schema:
            type: string
        "404":
          description: User Not Found
          schema:
            type: string
      summary: Get all boxes from a user based off of the user id
      tags:
      - Boxes
  /items/{box_id}:
    get:
      parameters:
      - description: Unique box id
        in: path
        name: box_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.BoxItem'
            type: array
        "400":
          description: 'Bad Request: (error description)'
          schema:
            type: string
        "404":
          description: box Not Found
          schema:
            type: string
      summary: Get items from a box id
      tags:
      - Boxes
swagger: "2.0"
